<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Git VCS Implementation Cover</title>
  <desc id="desc">Content-addressable object store and commit DAG diagram for a Git VCS implementation from scratch.</desc>
  <defs>
    <linearGradient id="git-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#28211b" />
      <stop offset="100%" stop-color="#191512" />
    </linearGradient>
    <pattern id="git-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#382e25" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#git-grad)" />
  <rect width="800" height="500" fill="url(#git-grid)" opacity="0.6" />

  <!-- Outer Board Frame -->
  <rect x="54" y="44" width="692" height="412" rx="14" fill="#1d1713" stroke="#483627" stroke-width="1.5" />

  <!-- Header bar -->
  <rect x="54" y="44" width="692" height="42" rx="14" fill="#2d221a" />
  <rect x="54" y="74" width="692" height="12" fill="#2d221a" />
  <circle cx="82" cy="65" r="5" fill="#f87171" />
  <circle cx="98" cy="65" r="5" fill="#fbbf24" />
  <circle cx="114" cy="65" r="5" fill="#f97316" />
  <text x="140" y="69" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="13" font-weight="600">git-vcs · content-addressable · object-db · packfile</text>
  <text x="686" y="69" text-anchor="end" fill="#8c6a51" font-family="ui-monospace, monospace" font-size="12">sha1 · zlib</text>

  <!-- Left: Content Addressable Storage (Blob -> Tree -> Commit) -->
  <g transform="translate(86, 112)">
    <text x="0" y="0" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">OBJECT DATABASE (DAG)</text>
    
    <!-- Commit Object Node -->
    <rect x="0" y="14" width="186" height="52" rx="6" fill="#35261c" stroke="#684a34" stroke-width="1.2" />
    <circle cx="16" cy="40" r="5" fill="#f97316" />
    <text x="30" y="34" fill="#fdba74" font-family="ui-monospace, monospace" font-size="11" font-weight="700">commit 8a4f91e</text>
    <text x="30" y="50" fill="#a88469" font-family="ui-monospace, monospace" font-size="9">tree c28d · parent e41a</text>

    <!-- Arrow down to Tree -->
    <path d="M 93 66 L 93 84" stroke="#7a5840" stroke-width="1.5" stroke-dasharray="2 2" />
    <polygon points="90,82 93,88 96,82" fill="#7a5840" />

    <!-- Tree Object Node -->
    <rect x="0" y="88" width="186" height="52" rx="6" fill="#2d2119" stroke="#5a402d" stroke-width="1.2" />
    <circle cx="16" cy="114" r="5" fill="#fbbf24" />
    <text x="30" y="108" fill="#fde68a" font-family="ui-monospace, monospace" font-size="11" font-weight="700">tree c28d301</text>
    <text x="30" y="124" fill="#a88469" font-family="ui-monospace, monospace" font-size="9">100644 blob 3e79 · src/</text>

    <!-- Arrow down to Blobs -->
    <path d="M 60 140 L 40 158" stroke="#7a5840" stroke-width="1.2" stroke-dasharray="2 2" />
    <path d="M 126 140 L 146 158" stroke="#7a5840" stroke-width="1.2" stroke-dasharray="2 2" />

    <!-- Blob 1 -->
    <rect x="0" y="158" width="86" height="42" rx="5" fill="#221913" stroke="#483323" />
    <text x="10" y="176" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="10" font-weight="600">blob 3e79</text>
    <text x="10" y="190" fill="#786252" font-family="ui-monospace, monospace" font-size="8">main.rs</text>

    <!-- Blob 2 -->
    <rect x="100" y="158" width="86" height="42" rx="5" fill="#221913" stroke="#483323" />
    <text x="110" y="176" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="10" font-weight="600">blob a01f</text>
    <text x="110" y="190" fill="#786252" font-family="ui-monospace, monospace" font-size="8">lib.rs</text>
  </g>

  <!-- Middle: Commit History Graph (Branching & Merging) -->
  <g transform="translate(300, 112)">
    <text x="0" y="0" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">BRANCH GRAPH &amp; REFS</text>

    <rect x="0" y="14" width="248" height="196" rx="8" fill="#1f1814" stroke="#443224" stroke-width="1" />

    <!-- Commit DAG Lines -->
    <g transform="translate(24, 30)">
      <!-- Main trunk line -->
      <line x1="30" y1="30" x2="30" y2="140" stroke="#785338" stroke-width="2" />
      
      <!-- Feature branch curve -->
      <path d="M 30 80 Q 70 80 70 50 L 70 30" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="3 3" />
      <path d="M 70 30 Q 70 10 30 10" fill="none" stroke="#f97316" stroke-width="2" />

      <!-- Nodes on Main -->
      <circle cx="30" cy="140" r="7" fill="#443224" stroke="#f97316" stroke-width="2" />
      <text x="48" y="144" fill="#a88469" font-family="ui-monospace, monospace" font-size="10">c0 initial</text>

      <circle cx="30" cy="80" r="7" fill="#443224" stroke="#f97316" stroke-width="2" />
      <text x="48" y="84" fill="#a88469" font-family="ui-monospace, monospace" font-size="10">c1 feature base</text>

      <!-- Node on Feature Branch -->
      <circle cx="70" cy="40" r="6" fill="#f97316" />
      <text x="86" y="44" fill="#fdba74" font-family="ui-monospace, monospace" font-size="10">feat: index</text>

      <!-- Merge Commit on Main -->
      <circle cx="30" cy="10" r="8" fill="#f97316" stroke="#fde047" stroke-width="2" />
      
      <!-- HEAD / main badge -->
      <rect x="110" y="0" width="80" height="22" rx="4" fill="#7c2d12" stroke="#ea580c" />
      <text x="150" y="15" text-anchor="middle" fill="#ffedd5" font-family="ui-monospace, monospace" font-size="10" font-weight="700">HEAD ──► main</text>
    </g>
  </g>

  <!-- Right: Plumbing & Porcelain Commands -->
  <g transform="translate(576, 112)">
    <text x="0" y="0" fill="#fed7aa" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">INTERNALS</text>

    <rect x="0" y="14" width="142" height="196" rx="8" fill="#1b1511" stroke="#3b2b1e" stroke-width="1" />
    
    <g transform="translate(14, 32)" fill="#a88469" font-family="ui-monospace, monospace" font-size="10">
      <text x="0" y="12" fill="#fdba74" font-weight="600">Plumbing:</text>
      <text x="0" y="28">hash-object</text>
      <text x="0" y="44">cat-file -p</text>
      <text x="0" y="60">write-tree</text>
      <text x="0" y="76">commit-tree</text>

      <text x="0" y="104" fill="#fdba74" font-weight="600">Porcelain:</text>
      <text x="0" y="120">init · add</text>
      <text x="0" y="136">commit · log</text>
      <text x="0" y="152">branch · checkout</text>
    </g>
  </g>

  <!-- Bottom: Staging Area Pipeline -->
  <g transform="translate(86, 334)">
    <rect x="0" y="0" width="632" height="98" rx="8" fill="#140f0c" stroke="#2e2116" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#f97316" />
    <text x="34" y="21" fill="#9a7152" font-family="ui-monospace, monospace" font-size="10" font-weight="600">THREE TREES ARCHITECTURE &amp; INDEX</text>
    
    <g transform="translate(20, 42)" fill="#a88469" font-family="ui-monospace, monospace" font-size="10">
      <rect x="0" y="0" width="160" height="32" rx="4" fill="#241912" stroke="#483323" />
      <text x="80" y="20" text-anchor="middle" fill="#fed7aa">Working Directory</text>
      
      <text x="175" y="20" fill="#785338">git add ──►</text>

      <rect x="238" y="0" width="144" height="32" rx="4" fill="#2c1e15" stroke="#684a34" />
      <text x="310" y="20" text-anchor="middle" fill="#fdba74">Index / Staging</text>

      <text x="396" y="20" fill="#785338">git commit ──►</text>

      <rect x="470" y="0" width="122" height="32" rx="4" fill="#382517" stroke="#ea580c" />
      <text x="531" y="20" text-anchor="middle" fill="#ffedd5" font-weight="600">HEAD Commit</text>
    </g>
  </g>
</svg>
