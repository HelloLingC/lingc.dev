<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Stack-based Typed Language Cover</title>
  <desc id="desc">Type system, stack effect inference, and bytecode execution diagram for a stack-based typed language.</desc>
  <defs>
    <linearGradient id="lang-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e272d" />
      <stop offset="100%" stop-color="#141a1f" />
    </linearGradient>
    <pattern id="lang-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#28353d" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#lang-grad)" />
  <rect width="800" height="500" fill="url(#lang-grid)" opacity="0.6" />

  <!-- Outer Window Frame -->
  <rect x="54" y="44" width="692" height="412" rx="14" fill="#172026" stroke="#2f414d" stroke-width="1.5" />

  <!-- Header bar -->
  <rect x="54" y="44" width="692" height="42" rx="14" fill="#202c34" />
  <rect x="54" y="74" width="692" height="12" fill="#202c34" />
  <circle cx="82" cy="65" r="5" fill="#f87171" />
  <circle cx="98" cy="65" r="5" fill="#fbbf24" />
  <circle cx="114" cy="65" r="5" fill="#38bdf8" />
  <text x="140" y="69" fill="#93c5fd" font-family="ui-monospace, monospace" font-size="13" font-weight="600">typed-concatenative · stack-effects · bytecode-vm</text>
  <text x="686" y="69" text-anchor="end" fill="#526d7f" font-family="ui-monospace, monospace" font-size="12">typecheck: ok</text>

  <!-- Left: Source Code & Type Signature -->
  <g transform="translate(86, 112)">
    <text x="0" y="0" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">SOURCE &amp; TYPE INFERENCE</text>
    
    <rect x="0" y="14" width="240" height="196" rx="8" fill="#1c262d" stroke="#334654" stroke-width="1" />
    
    <g transform="translate(16, 32)" font-family="ui-monospace, monospace" font-size="11" line-height="1.5">
      <!-- Type signature definition -->
      <text x="0" y="10" fill="#38bdf8" font-weight="600">def square_sum :</text>
      <text x="0" y="26" fill="#f472b6">  ( Int Int -- Int )</text>
      
      <!-- Code body -->
      <text x="0" y="52" fill="#94a3b8">  dup *</text>
      <text x="0" y="68" fill="#94a3b8">  swap</text>
      <text x="0" y="84" fill="#94a3b8">  dup *</text>
      <text x="0" y="100" fill="#94a3b8">  +</text>
      <text x="0" y="116" fill="#38bdf8" font-weight="600">end</text>

      <!-- Higher order type snippet -->
      <path d="M 0 134 L 208 134" stroke="#2d3d49" stroke-width="1" />
      <text x="0" y="152" fill="#a78bfa">map : ( [a] (a -- b) -- [b] )</text>
      <text x="0" y="168" fill="#34d399">✓ zero-cost stack abstraction</text>
    </g>
  </g>

  <!-- Middle: Stack Transition Visualizer -->
  <g transform="translate(352, 112)">
    <text x="0" y="0" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">STACK EVALUATION FLOW</text>

    <rect x="0" y="14" width="200" height="196" rx="8" fill="#1b242b" stroke="#334654" stroke-width="1" />

    <!-- Step 1: Initial Stack -->
    <g transform="translate(18, 30)">
      <rect x="0" y="0" width="46" height="64" rx="4" fill="#24333c" stroke="#486273" />
      <text x="23" y="24" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="600">4</text>
      <line x1="0" y1="32" x2="46" y2="32" stroke="#334654" />
      <text x="23" y="52" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">3</text>
      
      <text x="60" y="36" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="14" font-weight="700">──►</text>

      <!-- Step 2: Intermediate Stack -->
      <rect x="96" y="0" width="46" height="64" rx="4" fill="#24333c" stroke="#486273" />
      <text x="119" y="24" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, monospace" font-size="11" font-weight="600">16</text>
      <line x1="0" y1="32" x2="46" y2="32" stroke="#334654" />
      <text x="119" y="52" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="11">3</text>
    </g>

    <!-- Transition arrow down -->
    <path d="M 100 110 L 100 126" stroke="#4b687b" stroke-width="1.5" stroke-dasharray="2 2" />
    <polygon points="97,124 100,130 103,124" fill="#4b687b" />
    
    <!-- Final Stack Result -->
    <g transform="translate(64, 140)">
      <rect x="0" y="0" width="72" height="42" rx="5" fill="#1e3a47" stroke="#38bdf8" stroke-width="1.2" />
      <text x="36" y="26" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="13" font-weight="700">25 (Int)</text>
      <text x="36" y="-6" text-anchor="middle" fill="#67e8f9" font-family="ui-monospace, monospace" font-size="9">RESULT</text>
    </g>
  </g>

  <!-- Right: Bytecode Disassembly -->
  <g transform="translate(578, 112)">
    <text x="0" y="0" fill="#cbd5e1" font-family="ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="1">BYTECODE VM</text>

    <rect x="0" y="14" width="140" height="196" rx="8" fill="#192228" stroke="#314350" stroke-width="1" />
    
    <g transform="translate(14, 32)" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">
      <text x="0" y="12"><tspan fill="#486273">0000 </tspan><tspan fill="#e2e8f0">OP_DUP</tspan></text>
      <text x="0" y="28"><tspan fill="#486273">0001 </tspan><tspan fill="#e2e8f0">OP_MUL</tspan></text>
      <text x="0" y="44"><tspan fill="#486273">0002 </tspan><tspan fill="#e2e8f0">OP_SWAP</tspan></text>
      <text x="0" y="60"><tspan fill="#486273">0003 </tspan><tspan fill="#e2e8f0">OP_DUP</tspan></text>
      <text x="0" y="76"><tspan fill="#486273">0004 </tspan><tspan fill="#e2e8f0">OP_MUL</tspan></text>
      <text x="0" y="92"><tspan fill="#486273">0005 </tspan><tspan fill="#e2e8f0">OP_ADD</tspan></text>
      <text x="0" y="108"><tspan fill="#486273">0006 </tspan><tspan fill="#38bdf8">OP_RET</tspan></text>
      <text x="0" y="132" fill="#34d399" font-size="9">⚡ direct-threaded</text>
      <text x="0" y="146" fill="#34d399" font-size="9">✓ type verified</text>
    </g>
  </g>

  <!-- Bottom: Type Effect Pipeline -->
  <g transform="translate(86, 334)">
    <rect x="0" y="0" width="632" height="98" rx="8" fill="#12181d" stroke="#26353f" stroke-width="1" />
    <circle cx="20" cy="18" r="4" fill="#38bdf8" />
    <text x="34" y="21" fill="#648396" font-family="ui-monospace, monospace" font-size="10" font-weight="600">TYPE CHECKER &amp; INFERENCE PIPELINE</text>
    
    <g transform="translate(20, 42)" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">
      <rect x="0" y="0" width="112" height="32" rx="4" fill="#1f2d36" stroke="#3d5464" />
      <text x="56" y="20" text-anchor="middle" fill="#e2e8f0">AST Parsing</text>
      
      <text x="126" y="20" fill="#4d697c">→</text>

      <rect x="146" y="0" width="144" height="32" rx="4" fill="#1f2d36" stroke="#3d5464" />
      <text x="218" y="20" text-anchor="middle" fill="#e2e8f0">Stack Effect Solver</text>

      <text x="304" y="20" fill="#4d697c">→</text>

      <rect x="324" y="0" width="132" height="32" rx="4" fill="#1f2d36" stroke="#3d5464" />
      <text x="390" y="20" text-anchor="middle" fill="#e2e8f0">Bytecode Emitter</text>

      <text x="470" y="20" fill="#4d697c">→</text>

      <rect x="490" y="0" width="102" height="32" rx="4" fill="#1e3745" stroke="#38bdf8" />
      <text x="541" y="20" text-anchor="middle" fill="#38bdf8" font-weight="600">VM Runtime</text>
    </g>
  </g>
</svg>
