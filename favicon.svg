    filter="url(#shadow)"
  />

  <!-- Left Inner Ear -->
  <path
    d="M 35 44 C 34 30 38 27 44 33 C 41 40 38 45 35 44 Z"
    fill="#F8B4BD"
  />

  <!-- Right Inner Ear -->
  <path
    d="M 93 44 C 94 30 90 27 84 33 C 87 40 90 45 93 44 Z"
    fill="#F8B4BD"
  />

  <!-- Left Eye -->
  <ellipse cx="44" cy="68" rx="8" ry="9" fill="#2E302E" />
  <circle cx="41.5" cy="64.5" r="3.2" fill="#FFFFFF" />
  <circle cx="47" cy="71.5" r="1.5" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="84" cy="68" rx="8" ry="9" fill="#2E302E" />
  <circle cx="81.5" cy="64.5" r="3.2" fill="#FFFFFF" />
  <circle cx="87" cy="71.5" r="1.5" fill="#FFFFFF" />

  <!-- Blush Cheeks -->
  <ellipse cx="32" cy="78" rx="7.5" ry="4.5" fill="#F8C3CA" opacity="0.85" />
  <ellipse cx="96" cy="78" rx="7.5" ry="4.5" fill="#F8C3CA" opacity="0.85" />

  <!-- Nose -->
  <path d="M 60 71 Q 64 69 68 71 Q 64 76 60 71 Z" fill="#F8A5B0" />

  <!-- Mouth (ω) -->
  <path
    d="M 56 76 Q 60 81 64 77 Q 68 81 72 76"
    fill="none"
    stroke="#2E302E"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Whiskers -->
  <path
    d="M 14 68 L 28 71 M 12 78 L 27 77"
    stroke="#2E302E"
    stroke-width="4"
    stroke-linecap="round"
  />
  <path
    d="M 114 68 L 100 71 M 116 78 L 101 77"
    stroke="#2E302E"
    stroke-width="4"
    stroke-linecap="round"
  />
</svg>
