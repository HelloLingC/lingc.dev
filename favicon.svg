<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Cat Head & Ears -->
  <path
    d="M 28 48 C 20 22 28 16 42 26 C 52 22 76 22 86 26 C 100 16 108 22 100 48 C 114 66 114 90 98 106 C 82 120 46 120 30 106 C 14 90 14 66 28 48 Z"
    fill="#FFFDF8"
    stroke="#2E302E"
